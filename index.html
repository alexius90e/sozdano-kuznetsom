<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/index.css" />
    <script type="module" src="./js/index.js" defer></script>
  </head>

  <body>
    <header class="header">
      <div class="container">
        <div class="header__wrapper">
          <figure class="header__logo">
            <a class="header__logo-link" href="#">
              <img class="header__logo-link-image" src="./assets/logo.png" alt="logo" />
            </a>
          </figure>

          <div class="header__phone">
            <a class="header__phone-link" href="tel:+79999999999">+7 (999) 999-99-99</a>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="first-screen">
        <div class="container">
          <div class="first-screen__wrapper">
            <div class="first-screen__content">
              <h1 class="first-screen__title">
                <span>Стань сам кузнецом</span> <b>своего счастья</b>
              </h1>

              <div class="first-screen__quote">
                <div class="first-screen__quote-text">
                  “Невидимое царство Духа твориться неисповедимыми путями и нет никаких
                  законнических ограничений в этих путях”
                </div>
                <div class="first-screen__quote-author">Н.А.Бердяев</div>
              </div>

              <div class="first-screen__signup">
                <button class="first-screen__signup-button">
                  <img
                    class="first-screen__signup-button-icon"
                    src="./assets/ok-icon.svg"
                    alt="icon"
                  />
                  <span class="first-screen__signup-button-text">Хочу отковать амулет</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container"></div>
    </footer>
  </body>
</html>
